<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock · Paper · Scissors</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #06050f;
      --surface:     #0d0b1e;
      --border:      #1e1a3d;
      --neon-blue:   #00d4ff;
      --neon-pink:   #ff2d78;
      --neon-green:  #00ff9d;
      --neon-yellow: #ffe500;
      --text:        #c8c0f0;
      --text-dim:    #5a5278;
      --win-color:   #00ff9d;
      --lose-color:  #ff2d78;
      --tie-color:   #ffe500;
      --glow-blue:   0 0 8px #00d4ff, 0 0 24px #00d4ff55;
      --glow-pink:   0 0 8px #ff2d78, 0 0 24px #ff2d7855;
      --glow-green:  0 0 8px #00ff9d, 0 0 24px #00ff9d55;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    /* Grid scanline overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,212,255,0.015) 2px,
          rgba(0,212,255,0.015) 4px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    .shell {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
      gap: 2rem;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    header {
      text-align: center;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.4rem, 5vw, 2.6rem);
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--neon-blue);
      text-shadow: var(--glow-blue);
      animation: flicker 6s infinite;
    }

    .logo span { color: var(--neon-pink); text-shadow: var(--glow-pink); }

    .subtitle {
      margin-top: .4rem;
      font-size: .75rem;
      color: var(--text-dim);
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    @keyframes flicker {
      0%,95%,97%,100% { opacity: 1; }
      96% { opacity: .6; }
    }

    /* ── Score bar ────────────────────────────────────────────────────────── */
    .scoreboard {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .score-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .6rem 1.4rem;
      text-align: center;
      min-width: 90px;
    }

    .score-cell .label {
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: .3rem;
    }

    .score-cell .value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
    }

    .score-cell.you  .value { color: var(--neon-green);  text-shadow: var(--glow-green); }
    .score-cell.cpu  .value { color: var(--neon-pink);   text-shadow: var(--glow-pink);  }
    .score-cell.ties .value { color: var(--neon-yellow); }

    /* ── Arena ────────────────────────────────────────────────────────────── */
    .arena {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .combatant {
      display: flex; flex-direction: column; align-items: center;
      gap: .6rem;
      width: 130px;
    }

    .combatant .name {
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .weapon-display {
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
      transition: border-color .3s, box-shadow .3s, transform .3s;
      position: relative;
    }

    .weapon-display.revealed.win  { border-color: var(--neon-green);  box-shadow: var(--glow-green);  transform: scale(1.08); }
    .weapon-display.revealed.lose { border-color: var(--neon-pink);   box-shadow: var(--glow-pink);   }
    .weapon-display.revealed.tie  { border-color: var(--neon-yellow); box-shadow: 0 0 16px #ffe50055; }

    .weapon-display .question { font-size: 2.2rem; color: var(--text-dim); }

    .vs-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: .9rem;
      font-weight: 700;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Result message ───────────────────────────────────────────────────── */
    .result-msg {
      min-height: 2.2rem;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(.85rem, 3vw, 1.05rem);
      font-weight: 700;
      letter-spacing: .06em;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .35s, transform .35s;
    }

    .result-msg.show { opacity: 1; transform: none; }
    .result-msg.win  { color: var(--win-color);  text-shadow: var(--glow-green); }
    .result-msg.lose { color: var(--lose-color); text-shadow: var(--glow-pink);  }
    .result-msg.tie  { color: var(--tie-color);  }

    /* ── Streak banner ────────────────────────────────────────────────────── */
    .streak-banner {
      height: 1.4rem;
      text-align: center;
      font-size: .78rem;
      letter-spacing: .12em;
      color: var(--neon-yellow);
      opacity: 0;
      transition: opacity .3s;
    }
    .streak-banner.show { opacity: 1; }

    /* ── Weapon buttons ───────────────────────────────────────────────────── */
    .weapons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-weapon {
      display: flex; flex-direction: column; align-items: center;
      gap: .45rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.4rem;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, transform .15s;
      min-width: 90px;
      font-family: 'Share Tech Mono', monospace;
      color: var(--text);
    }

    .btn-weapon .icon { font-size: 2.2rem; }
    .btn-weapon .label-text {
      font-size: .65rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .btn-weapon .key {
      font-size: .6rem;
      color: var(--border);
      margin-top: -.1rem;
    }

    .btn-weapon:hover, .btn-weapon:focus-visible {
      border-color: var(--neon-blue);
      box-shadow: var(--glow-blue);
      transform: translateY(-3px);
      outline: none;
    }

    .btn-weapon:active { transform: translateY(0); }

    .btn-weapon:disabled {
      opacity: .35;
      pointer-events: none;
    }

    /* ── Reset ────────────────────────────────────────────────────────────── */
    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-family: 'Share Tech Mono', monospace;
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: .5rem 1.2rem;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .btn-reset:hover { border-color: var(--neon-pink); color: var(--neon-pink); }

    /* ── History log ──────────────────────────────────────────────────────── */
    .history-section { width: 100%; max-width: 480px; }

    .history-title {
      font-size: .65rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: .6rem;
    }

    .history-log {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .6rem;
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse; /* newest on top */
      gap: .35rem;
    }

    .history-log::-webkit-scrollbar { width: 4px; }
    .history-log::-webkit-scrollbar-track { background: transparent; }
    .history-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .log-row {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-size: .7rem;
      opacity: 0;
      animation: fadeIn .3s forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .log-row .round-num { color: var(--text-dim); min-width: 2.2rem; }
    .log-row .moves { flex: 1; color: var(--text); }
    .log-row .outcome-badge {
      font-size: .6rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: .15rem .45rem;
      border-radius: 3px;
      font-weight: 700;
    }
    .log-row .outcome-badge.win  { background:#00ff9d22; color: var(--win-color);  border: 1px solid #00ff9d44; }
    .log-row .outcome-badge.lose { background:#ff2d7822; color: var(--lose-color); border: 1px solid #ff2d7844; }
    .log-row .outcome-badge.tie  { background:#ffe50022; color: var(--tie-color);  border: 1px solid #ffe50044; }

    .log-empty {
      font-size: .72rem;
      color: var(--text-dim);
      text-align: center;
      padding: .5rem 0;
    }

    /* ── Keyboard hint ────────────────────────────────────────────────────── */
    .kbd-hint {
      font-size: .62rem;
      color: var(--text-dim);
      letter-spacing: .12em;
      text-align: center;
      margin-top: -.8rem;
    }

    /* ── API config ───────────────────────────────────────────────────────── */
    .api-bar {
      width: 100%; max-width: 480px;
      display: flex; align-items: center; gap: .5rem;
      flex-wrap: wrap;
    }

    .api-bar label { font-size: .65rem; letter-spacing: .15em; color: var(--text-dim); white-space: nowrap; }

    .api-bar input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: .72rem;
      padding: .35rem .6rem;
      min-width: 180px;
    }
    .api-bar input:focus { outline: none; border-color: var(--neon-blue); }

    .api-status {
      font-size: .65rem;
      letter-spacing: .12em;
      padding: .25rem .6rem;
      border-radius: 4px;
      white-space: nowrap;
    }
    .api-status.ok      { color: var(--neon-green); border: 1px solid #00ff9d44; }
    .api-status.err     { color: var(--neon-pink);  border: 1px solid #ff2d7844; }
    .api-status.loading { color: var(--text-dim);   border: 1px solid var(--border); }
  </style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <header>
    <div class="logo">Rock <span>·</span> Paper <span>·</span> Scissors</div>
    <div class="subtitle">Human vs Machine &nbsp;|&nbsp; Web Edition</div>
  </header>

  <!-- API bar -->
  <div class="api-bar">
    <label for="apiInput">API&nbsp;URL</label>
    <input id="apiInput" type="text" value="http://localhost:8000" placeholder="http://localhost:8000" />
    <span class="api-status loading" id="apiStatus">● not tested</span>
  </div>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="score-cell you">
      <div class="label">You</div>
      <div class="value" id="scoreYou">0</div>
    </div>
    <div class="score-cell ties">
      <div class="label">Ties</div>
      <div class="value" id="scoreTies">0</div>
    </div>
    <div class="score-cell cpu">
      <div class="label">CPU</div>
      <div class="value" id="scoreCPU">0</div>
    </div>
  </div>

  <!-- Streak banner -->
  <div class="streak-banner" id="streakBanner"></div>

  <!-- Arena -->
  <div class="arena">
    <div class="combatant">
      <div class="name">You</div>
      <div class="weapon-display" id="playerDisplay">
        <span class="question">?</span>
      </div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="combatant">
      <div class="name">CPU</div>
      <div class="weapon-display" id="cpuDisplay">
        <span class="question">?</span>
      </div>
    </div>
  </div>

  <!-- Result message -->
  <div class="result-msg" id="resultMsg"></div>

  <!-- Weapon buttons -->
  <div class="weapons">
    <button class="btn-weapon" data-choice="rock">
      <span class="icon">🪨</span>
      <span class="label-text">Rock</span>
      <span class="key">[ R ]</span>
    </button>
    <button class="btn-weapon" data-choice="paper">
      <span class="icon">📄</span>
      <span class="label-text">Paper</span>
      <span class="key">[ P ]</span>
    </button>
    <button class="btn-weapon" data-choice="scissors">
      <span class="icon">✂️</span>
      <span class="label-text">Scissors</span>
      <span class="key">[ S ]</span>
    </button>
  </div>

  <p class="kbd-hint">keyboard shortcuts: R · P · S</p>

  <button class="btn-reset" id="resetBtn">↺ &nbsp;Reset Score</button>

  <!-- History -->
  <div class="history-section">
    <div class="history-title">Round History</div>
    <div class="history-log" id="historyLog">
      <div class="log-empty" id="logEmpty">No rounds yet — make your move!</div>
    </div>
  </div>

</div>

<script>
  /* ── State ──────────────────────────────────────────────────────────────── */
  const state = {
    scores: { player: 0, tie: 0, computer: 0 },
    streak: 0,
    streakOwner: '',
    rounds: 0,
    busy: false,
  };

  /* ── DOM refs ───────────────────────────────────────────────────────────── */
  const $scoreYou     = document.getElementById('scoreYou');
  const $scoreTies    = document.getElementById('scoreTies');
  const $scoreCPU     = document.getElementById('scoreCPU');
  const $playerDisp   = document.getElementById('playerDisplay');
  const $cpuDisp      = document.getElementById('cpuDisplay');
  const $resultMsg    = document.getElementById('resultMsg');
  const $streakBanner = document.getElementById('streakBanner');
  const $historyLog   = document.getElementById('historyLog');
  const $logEmpty     = document.getElementById('logEmpty');
  const $resetBtn     = document.getElementById('resetBtn');
  const $apiInput     = document.getElementById('apiInput');
  const $apiStatus    = document.getElementById('apiStatus');
  const weaponBtns    = document.querySelectorAll('.btn-weapon');

  /* ── Helpers ────────────────────────────────────────────────────────────── */
  const apiBase = () => $apiInput.value.replace(/\/$/, '');

  function setDisplay(el, emoji, outcomeClass) {
    el.innerHTML = emoji ? `<span>${emoji}</span>` : '<span class="question">?</span>';
    el.className = 'weapon-display';
    if (outcomeClass) el.classList.add('revealed', outcomeClass);
  }

  function setResult(text, cls) {
    $resultMsg.textContent = text;
    $resultMsg.className = `result-msg show ${cls}`;
  }

  function updateScoreboard() {
    $scoreYou.textContent  = state.scores.player;
    $scoreTies.textContent = state.scores.tie;
    $scoreCPU.textContent  = state.scores.computer;
  }

  function updateStreak() {
    if (state.streak >= 2) {
      const owner = state.streakOwner === 'player' ? 'Your' : "CPU's";
      $streakBanner.textContent = `🔥 ${owner} ${state.streak}-round streak!`;
      $streakBanner.classList.add('show');
    } else {
      $streakBanner.classList.remove('show');
    }
  }

  function addHistoryRow(round, playerEmoji, player, cpuEmoji, computer, outcome) {
    if ($logEmpty) $logEmpty.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'log-row';
    row.innerHTML = `
      <span class="round-num">#${round}</span>
      <span class="moves">${playerEmoji} ${player} &nbsp;vs&nbsp; ${cpuEmoji} ${computer}</span>
      <span class="outcome-badge ${outcome}">${outcome}</span>
    `;
    $historyLog.prepend(row);
  }

  function setBusy(val) {
    state.busy = val;
    weaponBtns.forEach(b => b.disabled = val);
  }

  /* ── API calls ──────────────────────────────────────────────────────────── */
  async function pingApi() {
    $apiStatus.textContent = '● checking…';
    $apiStatus.className = 'api-status loading';
    try {
      const res = await fetch(`${apiBase()}/health`, { signal: AbortSignal.timeout(3000) });
      if (!res.ok) throw new Error('non-ok');
      $apiStatus.textContent = '● connected';
      $apiStatus.className = 'api-status ok';
    } catch {
      $apiStatus.textContent = '● offline';
      $apiStatus.className = 'api-status err';
    }
  }

  async function playRound(choice) {
    if (state.busy) return;
    setBusy(true);

    // Optimistically show player pick, CPU loading
    setDisplay($playerDisp, { rock:'🪨', paper:'📄', scissors:'✂️' }[choice], '');
    setDisplay($cpuDisp, '⏳', '');
    $resultMsg.className = 'result-msg';

    try {
      const res = await fetch(`${apiBase()}/play`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ player_choice: choice }),
        signal: AbortSignal.timeout(5000),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }

      const data = await res.json();
      const { player_choice, computer_choice, outcome, message,
              player_emoji, computer_emoji, outcome_emoji } = data;

      // Reveal CPU with a tiny delay for drama
      await new Promise(r => setTimeout(r, 350));

      // Determine per-side outcome class
      const cpuClass = outcome === 'win' ? 'lose' : outcome === 'lose' ? 'win' : 'tie';
      setDisplay($playerDisp, player_emoji,   outcome);
      setDisplay($cpuDisp,    computer_emoji, cpuClass);
      setResult(`${outcome_emoji}  ${message}`, outcome);

      // Update state
      state.rounds++;
      if (outcome === 'win') {
        state.scores.player++;
        state.streak = state.streakOwner === 'player' ? state.streak + 1 : 1;
        state.streakOwner = 'player';
      } else if (outcome === 'lose') {
        state.scores.computer++;
        state.streak = state.streakOwner === 'computer' ? state.streak + 1 : 1;
        state.streakOwner = 'computer';
      } else {
        state.scores.tie++;
        state.streak = 0;
        state.streakOwner = '';
      }

      updateScoreboard();
      updateStreak();
      addHistoryRow(state.rounds, player_emoji, player_choice,
                    computer_emoji, computer_choice, outcome);

      $apiStatus.textContent = '● connected';
      $apiStatus.className = 'api-status ok';

    } catch (err) {
      setDisplay($playerDisp, '', '');
      setDisplay($cpuDisp,    '', '');
      setResult(`⚠ ${err.message}`, 'lose');
      $apiStatus.textContent = '● error';
      $apiStatus.className = 'api-status err';
    } finally {
      setBusy(false);
    }
  }

  /* ── Event listeners ────────────────────────────────────────────────────── */
  weaponBtns.forEach(btn =>
    btn.addEventListener('click', () => playRound(btn.dataset.choice))
  );

  document.addEventListener('keydown', e => {
    if (state.busy) return;
    const map = { r: 'rock', p: 'paper', s: 'scissors' };
    const choice = map[e.key.toLowerCase()];
    if (choice) playRound(choice);
  });

  $resetBtn.addEventListener('click', () => {
    Object.assign(state, { scores: { player:0, tie:0, computer:0 },
                            streak: 0, streakOwner: '', rounds: 0, busy: false });
    updateScoreboard();
    updateStreak();
    setDisplay($playerDisp, '', '');
    setDisplay($cpuDisp,    '', '');
    $resultMsg.className = 'result-msg';
    $historyLog.innerHTML = '<div class="log-empty" id="logEmpty">No rounds yet — make your move!</div>';
  });

  $apiInput.addEventListener('change', pingApi);

  /* ── Init ───────────────────────────────────────────────────────────────── */
  pingApi();
</script>
</body>
</html>
